[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gamevault-sync"
dynamic = ["version"]
description = "Back up Steam and Special K screenshots to a GameVault server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "keyring>=25",
    "pillow>=10",
    "pystray>=0.19",
    "sv-ttk>=2.6",
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
gamevault-sync = "gamevault_sync.__main__:main"

[project.gui-scripts]
gamevault-sync-app = "gamevault_sync.__main__:main"

[tool.setuptools]
packages = ["gamevault_sync"]

[tool.setuptools.dynamic]
version = { attr = "gamevault_sync.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
